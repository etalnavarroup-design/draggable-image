<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Title -->
    <title>Interactive Sticker Decorator - 11th Monthsary</title>
    
    <!-- Open Graph Meta Tags for Canva Embed & Iframely Compatibility -->
    <meta property="og:title" content="Interactive Sticker Decorator">
    <meta property="og:description" content="Drag and drop 60+ cute aesthetic stickers, flowers, hearts, and charms!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://etalnavarroup-design.github.io/draggable-image/">
    <meta property="og:image" content="https://placehold.co/1200x630/ffe4e6/be123c?text=Interactive+Sticker+Pack">
    <meta property="og:site_name" content="Interactive Sticker Decorator">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Interactive Sticker Decorator">
    <meta name="twitter:description" content="Drag and drop 60+ cute aesthetic stickers, flowers, hearts, and charms!">
    <meta name="twitter:image" content="https://placehold.co/1200x630/ffe4e6/be123c?text=Interactive+Sticker+Pack">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Base page transparent setup for iframe embedding */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Interactive Canvas Area */
        #sticker-board {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }

        /* Draggable Sticker Styling */
        .draggable-sticker {
            position: absolute;
            cursor: grab;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: transform 0.1s ease, filter 0.2s ease;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.15));
            will-change: transform, left, top;
            padding: 4px;
            border-radius: 9999px;
        }

        .draggable-sticker:active, .draggable-sticker.dragging {
            cursor: grabbing;
            transform: scale(1.18) rotate(3deg);
            filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.25));
            z-index: 99999 !important;
        }

        /* Custom Vector SVG Sizes */
        .svg-sticker {
            width: 72px;
            height: 72px;
        }

        /* Controls Panel Overlay */
        .control-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 100000;
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .btn-action {
            background: #ffffff;
            color: #4b5563;
            border: 1px solid #e5e7eb;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-action:hover {
            background: #f9fafb;
            color: #111827;
            border-color: #d1d5db;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div id="sticker-board">
        <!-- Control buttons -->
        <div class="control-panel">
            <button class="btn-action" onclick="resetStickers()">
                🔄 Reset Board
            </button>
            <button class="btn-action" onclick="shufflePositions()">
                🔀 Scatter
            </button>
        </div>

        <!-- Stickers will be auto-generated here by JavaScript -->
    </div>

    <script>
        // Array of 60+ Aesthetic Emoji Stickers & Custom SVGs
        const emojiStickers = [
            // Hearts & Romance
            "💖", "💗", "💓", "💞", "💕", "💌", "❤️", "🧡", "💛", "💚", "💙", "💜", "🤎", "🖤", "🤍",
            // Flowers & Nature
            "🌸", "🌺", "🌹", "🌷", "🌻", "🌼", "💐", "🌿", "🍀", "🌱",
            // Sweets & Treats
            "🍓", "🍒", "🎂", "🍰", "🧁", "🍫", "🍬", "🍭", "🍩", "🍨", "🍧", "🍪", "🥞",
            // Sparkles & Aesthetics
            "✨", "🌟", "⭐", "💫", "🎀", "🎈", "🎉", "👑", "🕊️", "🦋", "🧸", "🕯️", "🎁", "🪄", "🎵", "🎶",
            // Cute Faces & Moods
            "🥰", "🥺", "😻", "😘", "🥳", "😻", "👩‍❤️‍👨"
        ];

        // Custom Aesthetic Vector SVGs
        const svgStickers = [
            // 11 Months Charm SVG
            `<svg class="svg-sticker" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#FFF1F2" stroke="#F43F5E" stroke-width="4"/>
                <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-size="28" font-weight="bold" fill="#BE123C">11</text>
                <text x="50%" y="68%" dominant-baseline="middle" text-anchor="middle" font-size="11" font-weight="bold" fill="#FB7185" letter-spacing="1">MONTHS</text>
            </svg>`,
            // Aesthetic Pink Ribbon Bow SVG
            `<svg class="svg-sticker" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 45C40 30 15 25 20 45C25 60 45 50 50 50C55 50 75 60 80 45C85 25 60 30 50 45Z" fill="#F43F5E"/>
                <path d="M50 50L30 85L45 75L50 55L55 75L70 85L50 50Z" fill="#E11D48"/>
                <circle cx="50" cy="48" r="7" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/>
            </svg>`,
            // Strawberry Charm SVG
            `<svg class="svg-sticker" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 88C65 88 80 70 80 48C80 30 68 25 50 25C32 25 20 30 20 48C20 70 35 88 50 88Z" fill="#E11D48"/>
                <path d="M50 25C45 15 30 18 35 28C40 20 50 20 50 25C50 20 60 20 65 28C70 18 55 15 50 25Z" fill="#16A34A"/>
                <circle cx="35" cy="40" r="2" fill="#FEF08A"/>
                <circle cx="50" cy="45" r="2" fill="#FEF08A"/>
                <circle cx="65" cy="40" r="2" fill="#FEF08A"/>
                <circle cx="40" cy="60" r="2" fill="#FEF08A"/>
                <circle cx="60" cy="60" r="2" fill="#FEF08A"/>
                <circle cx="50" cy="73" r="2" fill="#FEF08A"/>
            </svg>`,
            // Birthday Candle SVG
            `<svg class="svg-sticker" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="42" y="35" width="16" height="50" rx="4" fill="#F472B6"/>
                <path d="M42 40L58 48M42 55L58 63M42 70L58 78" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                <path d="M50 35V25" stroke="#4B5563" stroke-width="2"/>
                <path d="M50 8C45 18 47 24 50 25C53 24 55 18 50 8Z" fill="#F59E0B"/>
                <path d="M50 14C48 19 49 22 50 23C51 22 52 19 50 14Z" fill="#FEF08A"/>
            </svg>`
        ];

        const board = document.getElementById('sticker-board');
        let currentZIndex = 10;

        function createStickers() {
            board.querySelectorAll('.draggable-sticker').forEach(s => s.remove());

            const allItems = [
                ...svgStickers.map(svg => ({ type: 'svg', content: svg })),
                ...emojiStickers.map(emoji => ({ type: 'emoji', content: emoji }))
            ];

            const cols = Math.floor(Math.sqrt(allItems.length * 1.5));
            const padding = 20;

            allItems.forEach((item, index) => {
                const sticker = document.createElement('div');
                sticker.className = 'draggable-sticker';
                
                if (item.type === 'emoji') {
                    sticker.style.fontSize = `${Math.floor(Math.random() * 16) + 48}px`; // 48px - 64px
                    sticker.innerText = item.content;
                } else {
                    sticker.innerHTML = item.content;
                }

                // Scatter in grid layout initially
                const row = Math.floor(index / cols);
                const col = index % cols;
                
                const posX = (col * (window.innerWidth / cols)) + (Math.random() * 20 - 10) + padding;
                const posY = (row * 80) + (Math.random() * 20 - 10) + padding + 40;

                sticker.style.left = `${Math.min(Math.max(posX, 10), window.innerWidth - 80)}px`;
                sticker.style.top = `${Math.min(Math.max(posY, 10), window.innerHeight - 80)}px`;
                sticker.style.zIndex = currentZIndex++;

                makeDraggable(sticker);
                board.appendChild(sticker);
            });
        }

        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            function onStart(e) {
                isDragging = true;
                element.classList.add('dragging');
                element.style.zIndex = ++currentZIndex;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;

                document.addEventListener('mousemove', onMove, { passive: false });
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
            }

            function onMove(e) {
                if (!isDragging) return;
                e.preventDefault();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                element.style.left = `${initialLeft + deltaX}px`;
                element.style.top = `${initialTop + deltaY}px`;
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                element.classList.remove('dragging');

                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }

            element.addEventListener('mousedown', onStart);
            element.addEventListener('touchstart', onStart, { passive: false });
        }

        function resetStickers() {
            createStickers();
        }

        function shufflePositions() {
            const stickers = document.querySelectorAll('.draggable-sticker');
            stickers.forEach(sticker => {
                const randomX = Math.random() * (window.innerWidth - 100) + 10;
                const randomY = Math.random() * (window.innerHeight - 100) + 10;
                sticker.style.left = `${randomX}px`;
                sticker.style.top = `${randomY}px`;
            });
        }

        // Initialize on page load
        window.onload = () => {
            createStickers();
        };

        // Adjust positions on screen resize
        window.onresize = () => {
            const stickers = document.querySelectorAll('.draggable-sticker');
            stickers.forEach(sticker => {
                if (sticker.offsetLeft > window.innerWidth) {
                    sticker.style.left = `${window.innerWidth - 80}px`;
                }
                if (sticker.offsetTop > window.innerHeight) {
                    sticker.style.top = `${window.innerHeight - 80}px`;
                }
            });
        };
    </script>
</body>
</html>
